name: release

# On main, Changesets either opens (or updates) the "Version packages" pull
# request from the changesets waiting in .changeset/, or, once that pull
# request is merged, publishes the new versions to npm with provenance.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Publishing is npm's trusted publishing: every package names this
      # workflow as its trusted publisher, and npm trades the job's OIDC
      # token for a short-lived one. No npm token is stored anywhere. It
      # needs npm 11.5.1 or later; Node 24's own npm can be older.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm release
          title: Version packages
          commit: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
